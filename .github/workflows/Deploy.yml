name: Build and Deploy
on:
  push:
    branches:
      - main
      - master

# When two jobs run in parallel, cancel the older ones, to make sure that the website is generated from the most recent commit.
concurrency:
    group: pluto-export
    cancel-in-progress: true

# This action needs permission to write the exported HTML file to the gh-pages branch.
permissions:
    contents: write
    # (all other permission fields default to "none")

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
    # NOTE: Python is necessary for the pre-rendering (minification) step of Franklin
    - name: Install python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    # NOTE: Here you can install dependencies such as matplotlib if you use
    # packages such as PyPlot.
    # - run: pip install matplotlib
    - name: Install Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: "1" # This will automatically pick the latest Julia version
    # NOTE
    #   The steps below ensure that NodeJS and Franklin are loaded then it
    #   installs highlight.js which is needed for the prerendering step
    #   (code highlighting + katex prerendering).
    #   Then the environment is activated and instantiated to install all
    #   Julia packages which may be required to successfully build your site.
    #   The last line should be `optimize()` though you may want to give it
    #   specific arguments, see the documentation or ?optimize in the REPL.
    - run: julia -e '
            using Pkg; Pkg.activate("."); Pkg.instantiate();
            using NodeJS; run(`$(npm_cmd()) install highlight.js`); run(`$(npm_cmd()) install gh-pages`);
            include("literate.jl");
            using Franklin;
            optimize()'

    - name: Cache Julia artifacts & such
      uses: julia-actions/cache@v2
      with:
        cache-registries: "true"

    # We set up a folder that Pluto can use to cache exported notebooks. If the notebook file did not change, then Pluto can take the exported file from cache instead of running the notebook.
    - name: Set up notebook state cache
      uses: actions/cache@v4
      with:
          path: pluto_state_cache
          key: ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}-${{ hashFiles('**/*jl') }}
          restore-keys: |
              ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}

    - name: Ignore notebook state cache in export (should be ignored since we only export __site anyway)
      run: echo 'pluto_state_cache' >> .gitignore

    - name: Run & export Pluto notebooks
      run: |
        julia -e 'using Pkg
          Pkg.activate(mktempdir())
          Pkg.add([
            Pkg.PackageSpec(name="PlutoSliderServer", version="1"),
          ])

          import PlutoSliderServer

          PlutoSliderServer.github_action(".";
            Export_cache_dir="pluto_state_cache",
            Export_baked_notebookfile=false,
            Export_baked_state=false,
            output_dir=__site,
            # more parameters can go here
          )'

    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@releases/v4
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site
        clean-exclude: talks # Don't touch at this folder, this is the one handled by `ExportPluto.yaml`
