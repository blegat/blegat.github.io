name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Install LaTeX and bibliography tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          latexmk texlive-latex-extra texlive-fonts-extra texlive-science \
          texlive-bibtex-extra biber ghostscript python3-pygments
    - name: Compile public papers, slides, and posters
      run: |
        python3 scripts/build_documents.py
        python3 scripts/check_document_links.py
    - name: Save LaTeX logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: document-logs
        path: |
          _build/**/*.log
          _build/**/*.blg
    - name: Save compiled PDFs
      uses: actions/upload-artifact@v4
      with:
        name: documents
        path: _documents/
        if-no-files-found: error
  build-and-deploy:
    needs: documents
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        persist-credentials: false
    # NOTE: Python is necessary for the pre-rendering (minification) step
    - name: Install python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    # NOTE: Here you can install dependencies such as matplotlib if you use
    # packages such as PyPlot.
    # - run: pip install matplotlib
    - name: Install Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1' # Latest stable Julia release.
    # NOTE
    #   The steps below ensure that NodeJS and Franklin are loaded then it
    #   installs highlight.js which is needed for the prerendering step
    #   (code highlighting + katex prerendering).
    #   Then the environment is activated and instantiated to install all
    #   Julia packages which may be required to successfully build your site.
    #   The last line should be `optimize()` though you may want to give it
    #   specific arguments, see the documentation or ?optimize in the REPL.
    - run: julia -e '
            using Pkg; Pkg.activate("."); Pkg.instantiate();
            using NodeJS; run(`$(npm_cmd()) install highlight.js`); run(`$(npm_cmd()) install gh-pages`);
            include("literate.jl");
            using Franklin;
            optimize()'
    - name: Remove slides from built site
      run: rm -rf __site/slides
    - name: Download compiled PDFs
      uses: actions/download-artifact@v4
      with:
        name: documents
        path: __site
    - name: Build and Deploy
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site
        CLEAN_EXCLUDE: '["slides"]'
